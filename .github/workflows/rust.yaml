name: Rust style

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup rust toolchain
        run: rustup show
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check day-based learner test runner
        run: cargo test -p xtask --locked
      - name: exercise canonical learner test commands
        env:
          XTASK_LIST_ONLY: "1"
        run: |
          cargo xtask test day_02::checkpoint_1
          cargo xtask test day_02
          cargo xtask test-through day_02
