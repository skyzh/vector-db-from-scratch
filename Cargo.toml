[workspace]
members = [
    "xtask",
    "vector-db-benchmark-support",
    "vector-db/core",
    "vector-db/datafusion",
    "vector-db-starter/core",
    "vector-db-starter/datafusion",
]
exclude = ["vendor/datafusion-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.2.0-alpha.1"

[workspace.dependencies]
async-trait = "0.1"
datafusion = { version = "54", default-features = false, features = ["nested_expressions", "sql"] }
datafusion-cli = { path = "vendor/datafusion-cli", version = "54.1.0" }
sqllogictest = "0.29"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vector-db-from-scratch-benchmark-support = { path = "vector-db-benchmark-support", version = "0.2.0-alpha.1" }
vector-db-from-scratch-core = { path = "vector-db/core", version = "0.2.0-alpha.1" }
vector-core = { package = "vector-db-from-scratch-core-starter", path = "vector-db-starter/core", version = "0.2.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
