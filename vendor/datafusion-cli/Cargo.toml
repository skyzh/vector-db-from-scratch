[package]
name = "datafusion-cli"
description = "A course-scoped vendored DataFusion CLI library."
readme = "README.md"
version = "54.1.0"
edition = "2024"
homepage = "https://datafusion.apache.org"
repository = "https://github.com/apache/datafusion"
license = "Apache-2.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
rust-version = "1.88"
publish = false

[features]
default = []
backtrace = ["datafusion/backtrace"]

[dependencies]
async-trait = "0.1"
datafusion = { version = "54", default-features = false, features = ["nested_expressions", "sql"] }
futures = "0.3"
rustyline = "18"
tokio = { version = "1", features = ["macros", "signal"] }

[workspace]
